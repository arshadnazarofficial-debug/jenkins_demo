<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Application</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #333;
            text-align: center;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
        }

        .container {
            padding: 80px 20px;
        }

        h1 {
            font-size: 45px;
            margin-bottom: 15px;
        }

        p {
            font-size: 20px;
            color: #666;
        }

        .card {
            background: white;
            max-width: 600px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        footer {
            margin-top: 80px;
            padding: 20px;
            background: #222;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h2>My Web Application</h2>
    </header>

    <div class="container">

        <div class="card">
            <h1>Welcome! 🚀</h1>

            <p>
                This website is running successfully.
            </p>

            <p>
                Jenkins Demo
            </p>

            <button onclick="showMessage()">
                Click Me
            </button>
        </div>

    </div>

    <footer>
        <p style="color:white;">
            © 2026 My Web Application
        </p>
    </footer>

    <script>
        function showMessage() {
            alert("Website is working successfully! 🎉");
        }
    </script>

</body>
</html>
